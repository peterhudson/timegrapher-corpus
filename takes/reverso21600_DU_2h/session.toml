watch = "JLC Reverso replica (manual wind, unknown movement)"
bph = 21600
lift = 52
notes = "Dial up (tilted), about 2 h in 13 files of 10 min, lift 52°, the first 21,600 vph take. Position: tilted, not flat. The strap ran under the grey stand's cradle, so dial up here is dial up tilted toward crown down (the Yacht-Master takes were head only and level). the owner's check: held as on this stand +16 to +17 s/d at 243°; held flat +6 s/d at 252°. Rates on the sound card clock, as tg reads them; the clock-corrected whole-take report is in calibrated/. Reference rate is tg's mean of its readings, with its median in the source. tg read at lift 55° with amplitude scaled by 52/55. Some clipping from file 02 on (Mic 10/16), which may shift the unlock edge and so the beat error from the unlock."

